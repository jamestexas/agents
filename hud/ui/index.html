<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUD</title>
    <style>
      /* No external fonts, no CDN, no framework: this page must render with
         the network unplugged. */
      :root {
        /* SynthWave '84 */
        --bg: #262335;
        --panel: #241b2f;
        --card: #2a2139;
        --accent: #f97e72;
        --hot: #fe4450;
        --magenta: #ff7edb;
        --cyan: #36f9f6;
        --cyan2: #03edf9;
        --green: #72f1b8;
        --yellow: #f3e70f;
        --muted: #848bbd;
        --button: #614D85;
        --fg: #f4f0ff;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 var(--sans);
        display: flex;
        flex-direction: column;
      }
      a {
        color: var(--accent);
      }
      /* `.badge` (0-1-0) outranks `a` (0-0-1), so a linked ticket chip rendered
         in the same muted grey as an inert one — the one place in a design whose
         whole premise is "every affordance is a link out" where the affordance
         was invisible. */
      a.badge {
        color: var(--accent);
        border-color: currentColor;
      }

      /* ---- header bar: dial is a placeholder until the dynamic bead ---- */
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--card);
        background: var(--panel);
        font-family: var(--mono);
        font-size: 13px;
        flex: none;
      }
      /* Base = the unknown state: no board answer yet, or none available. The
         quietest of the three, because it is the one that says nothing. The
         glow lives on the needs-you state instead, where it is earned. */
      .dial {
        color: var(--muted);
        border: 1px solid var(--card);
        border-radius: 999px;
        padding: 3px 10px;
      }
      /* Nothing waiting: the quiet state, and the only one that should read as
         all-clear. */
      .dial[data-count="none"] {
        color: var(--green);
      }
      /* Something waiting. This is the page's whole purpose, so it gets the
         accent and the glow — earned here, unlike on the pre-load state. */
      .dial[data-count="some"] {
        color: var(--accent);
        text-shadow: 0 0 6px currentColor;
      }
      /* Freshness without spending colour, matching .panel.stale: a snapshot
         is legible but visibly not now, whatever the count says. */
      .dial.stale {
        border-style: dashed;
        opacity: 0.6;
      }
      header .spacer {
        flex: 1;
      }
      header button {
        background: var(--button);
        color: var(--fg);
        border: 1px solid var(--card);
        border-radius: 6px;
        padding: 3px 9px;
        font-family: var(--mono);
        cursor: pointer;
      }
      header button:hover {
        border-color: var(--accent);
      }
      #generated {
        color: var(--muted);
      }

      /* ---- two columns: content left, dynamic panels right ---- */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
      }
      @media (max-width: 860px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        aside {
          display: none;
        }
      }
      #left {
        overflow: auto;
        padding: 14px 18px 60px;
      }
      aside {
        overflow: auto;
        border-left: 1px solid var(--card);
        background: var(--panel);
        padding: 14px;
      }

      h2.section {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--magenta);
        text-shadow: 0 0 6px currentColor;
        margin: 22px 0 8px;
      }
      h2.section:first-child {
        margin-top: 4px;
      }
      /* The heading now lives in a <summary>, so its own block margin would
         push the caret out of line — and `:first-child` can no longer match it,
         since the first child of the column is the <details>. Both move to the
         wrapper. */
      details.section-fold > summary h2.section {
        margin: 0;
      }
      details.section-fold {
        margin: 22px 0 8px;
      }
      details.section-fold:first-child {
        margin-top: 4px;
      }
      h2.section .count {
        color: var(--muted);
        font-weight: 400;
      }
      /* Warmth, shown because it is what the order is computed from. Pushed
         right so the group names stay left-aligned and scannable as a column;
         muted because it explains the order rather than competing with it. */
      /* The section's one-line answer to "what is this". Muted and small: it
         is there to be read once and then ignored, not to compete with the
         entries under it. */
      .about {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .tail-label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      h3.group .gdate {
        margin-left: auto;
        color: var(--muted);
        font-weight: 400;
      }
      /* Inside a <summary> the heading is a row in a flex line, not a block,
         so its standalone margin would push the caret out of alignment. */
      details.fold > summary h3.group.in-summary {
        margin: 0;
      }
      h3.group {
        font: 600 12px/1 var(--mono);
        color: var(--fg);
        margin: 14px 0 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .empty {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        padding: 2px 0 6px;
      }

      ul.entries {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .entry {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 6px;
        color: var(--fg);
        font: inherit;
        padding: 5px 8px;
        cursor: pointer;
      }
      .entry:hover {
        background: var(--card);
      }
      .entry:hover .title {
        color: var(--cyan2);
      }
      .entry .caret {
        color: var(--muted);
        font-size: 11px;
      }
      .entry .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--cyan);
      }
      /* The project brief. Borrows the group heading's weight and colour
         rather than inventing a treatment, so the eye reads brief-then-notes
         as one hierarchy. Not a chip: this is the axis that deserves weight,
         and the review's whole direction was fewer chips, not another one. */
      .entry .title.brief {
        color: var(--fg);
        font-weight: 600;
      }
      .entry .meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .badge {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        border: 1px solid var(--card);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .badge.warn {
        color: var(--yellow);
        border-color: var(--yellow);
      }
      .badge.hot {
        color: var(--hot);
        border-color: var(--hot);
      }
      .badge.parked,
      .badge.done {
        color: var(--muted);
      }

      /* ---- document view: replaces the list in place ---- */
      #doc[hidden] {
        display: none;
      }
      #docbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      #docbar button {
        background: var(--button);
        color: var(--fg);
        border: 1px solid var(--card);
        border-radius: 6px;
        padding: 3px 9px;
        font: inherit;
        cursor: pointer;
      }
      /* Copies location.href. The one affordance on this page that is not a
         disclosure or a link out — and it still touches nothing. */
      button.copylink {
        background: none;
        color: var(--muted);
        border: 1px solid var(--card);
        border-radius: 5px;
        padding: 1px 6px;
        font: inherit;
        cursor: pointer;
      }
      button.copylink:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      /* A deep link that no longer resolves: said plainly, tree still there. */
      #notfound[hidden] {
        display: none;
      }
      #notfound {
        border: 1px dashed var(--yellow);
        border-radius: 8px;
        color: var(--yellow);
        font-family: var(--mono);
        font-size: 12px;
        padding: 8px 11px;
        margin-bottom: 12px;
      }
      /* The prose measure sits on each block rather than on the container, so
         that one kind of block — a diagram — can take the whole column while
         everything else keeps the width it had. The body is wrapped in a div,
         so the measure lands on that div's children; capping the wrapper
         would cap the diagram with it.
         Stated in rem, not ch: `ch` resolves against each element's own font,
         which on a per-block rule would let headings run wider than the body
         text they head. 43rem is the same 688px the container used to carry
         as 78ch. */
      #docbody {
        max-width: none;
      }
      #docbody > .meta-chips,
      #docbody > pre,
      #docbody > div > * {
        max-width: 43rem;
      }
      #docbody h1,
      #docbody h2,
      #docbody h3 {
        line-height: 1.3;
      }
      #docbody h1 {
        font-size: 22px;
        border-bottom: 1px solid var(--card);
        padding-bottom: 6px;
      }
      #docbody h2 {
        font-size: 17px;
        color: var(--fg);
      }
      #docbody code,
      #docbody pre {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      #docbody :not(pre) > code {
        background: var(--card);
        border: 1px solid var(--card);
        border-radius: 4px;
        padding: 1px 4px;
      }
      #docbody pre {
        background: var(--panel);
        border: 1px solid var(--card);
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
      }
      #docbody blockquote {
        margin: 0;
        padding-left: 12px;
        border-left: 3px solid var(--card);
        color: var(--muted);
      }
      #docbody table {
        border-collapse: collapse;
      }
      #docbody th,
      #docbody td {
        border: 1px solid var(--card);
        padding: 4px 8px;
        text-align: left;
      }
      #docbody img {
        max-width: 100%;
      }
      /* The one block allowed out of the prose measure — but only once it is
         actually a diagram. Until mermaid has parsed it, and forever if it
         cannot, the block is an ordinary code block: it keeps the measure and
         the `pre` styling above, and sits at the same width as every other
         code block on the page. */
      #docbody > div > .mermaid-block[data-mermaid="rendered"] {
        max-width: none;
      }
      #docbody .mermaid-block {
        margin: 0 0 12px;
        overflow: auto;
      }
      #docbody .mermaid-block[data-mermaid="rendered"] {
        background: var(--panel);
        border: 1px solid var(--card);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }
      #docbody .mermaid-block svg {
        max-width: 100%;
        height: auto;
      }
      /* Mermaid marks a node carrying a click directive `clickable`; say so
         with the cursor, since the link is drawn inside the SVG and gets none
         of the page's own anchor styling. */
      #docbody .mermaid-block .clickable {
        cursor: pointer;
      }
      .meta-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 16px;
      }

      /* ---- right column: dynamic panels ---- */
      .panel {
        border: 1px solid var(--card);
        border-radius: 8px;
        background: var(--card);
        margin-bottom: 12px;
        overflow: hidden;
      }
      /* A source with neither live data nor a snapshot has no panel at all. */
      .panel[hidden] {
        display: none;
      }
      /* Serving a snapshot: readable, unmistakably not live. */
      .panel.stale {
        opacity: 0.6;
        border-style: dashed;
      }
      /* One line across the top when the page is NOT showing live data.
         Per-panel staleness is deliberately quiet — dashed and dimmed — which
         is right for one panel and wrong for the whole page: a reader who
         glances at a number should not have to audit six panels to learn that
         none of them came from a live source. Severity is worst-wins and the
         vocabulary is closed, so "everything is live" is the only state that
         renders nothing. */
      #connstate {
        padding: 6px 10px;
        font: 600 11px/1.4 var(--mono);
        letter-spacing: 0.04em;
        border-bottom: 1px solid;
      }
      /* Neutral on purpose. A snapshot is old but TRUE, so it is the mildest
         of the four and must not compete with the warning below it for
         attention -- the same reasoning that keeps .panel.stale dimmed rather
         than coloured. */
      #connstate.stale {
        color: #555;
        background: #f2f2f0;
        border-color: #dcdcd6;
      }
      #connstate.absent {
        color: #8a3f1f;
        background: #fdeee3;
        border-color: #e6c3a8;
      }
      /* Answered, but collecting from broken upstreams: current and
         incomplete rather than old and whole. Yellow because this is a
         warning in the ordinary sense -- something needs fixing, and it is
         not catastrophic. */
      #connstate.degraded {
        color: #7a5c00;
        background: #fdf3cf;
        border-color: #e8d48a;
      }
      /* Example payloads get the loudest treatment: stale real data is old but
         true, whereas example data is false now and would stay false however
         fresh it became. */
      #connstate.example {
        color: #fff;
        background: #a3321a;
        border-color: #a3321a;
      }
      .panel > h2 {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--magenta);
        text-shadow: 0 0 6px currentColor;
        margin: 0;
        padding: 9px 11px;
        border-bottom: 1px solid var(--card);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .panel > h2 .stamp {
        flex: 1;
        text-align: right;
        letter-spacing: 0;
        text-transform: none;
        font-weight: 400;
        color: var(--muted);
      }
      .panel > .body {
        padding: 11px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
      }

      /* One row per board item / peer / digest line. Everything is a link out:
         the HUD watches, the human acts in the tool that owns the action. */
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .rows > li {
        padding: 6px 0;
        border-top: 1px solid var(--card);
      }
      .rows > li:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .rows > li:last-child {
        padding-bottom: 0;
      }
      .row-top {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .row-top .num {
        color: var(--muted);
      }
      .row-top .text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--fg);
      }
      .row-sub {
        color: var(--muted);
        padding-top: 2px;
      }
      .row-sub .needs-you {
        color: var(--hot);
      }
      .handle {
        color: var(--fg);
      }
      .prlinks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 3px;
      }

      /* ---- sessions panel: a viewport onto ~/.claude, never an archive ---- */
      .sgroup {
        font: 600 11px/1 var(--mono);
        color: var(--fg);
        margin: 10px 0 5px;
      }
      .sessions > .sgroup:first-child {
        margin-top: 0;
      }
      /* A disclosure, not an action: it opens the detail, it touches nothing. */
      button.sess {
        display: flex;
        align-items: baseline;
        gap: 6px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 5px;
        padding: 2px 3px;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.sess:hover {
        background: var(--panel);
      }
      button.sess .text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.sess:hover .text {
        color: var(--cyan2);
      }
      .sdetail[hidden] {
        display: none;
      }
      .sdetail {
        padding: 3px 3px 1px;
      }
      .sdetail .row-sub {
        word-break: break-all;
      }
      .greyed {
        color: var(--muted);
        font-style: italic;
      }
      /* ---- loadout panel: provenance and drift, disclosed not acted on ---- */
      .drift {
        margin-bottom: 10px;
      }
      /* The one interaction this panel has is a disclosure triangle, and it is
         native: no handler, nothing to click that changes anything on disk. */
      details.fold > summary {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 2px 0;
        cursor: pointer;
        list-style: none;
      }
      details.fold > summary::-webkit-details-marker {
        display: none;
      }
      details.fold > summary::before {
        content: "\25B8";
        color: var(--muted);
      }
      details.fold[open] > summary::before {
        content: "\25BE";
      }
      details.fold > .fold-body {
        padding: 1px 0 3px 14px;
      }
      .glyph {
        flex: none;
        width: 1em;
        color: var(--cyan);
      }
      .glyph.plain {
        color: var(--muted);
      }
      /* Absolute paths are long and must stay readable rather than ellipse. */
      .chain {
        word-break: break-all;
      }

      .footnote {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        margin-top: 10px;
        padding-top: 7px;
        border-top: 1px solid var(--card);
      }
    </style>
  </head>
  <body>
    <header>
      <!-- Dial: count of work-board items in state `needs_you`. -->
      <span class="dial" id="dial" title="work-board not yet loaded">&#9678; needs-you: &mdash;</span>
      <span class="spacer"></span>
      <button id="refresh" title="reload the tree and every dynamic panel">&#8635;</button>
      <span id="generated">generated &mdash;</span>
    </header>

    <!-- Filled by paintConnState(); hidden whenever every configured source is
         live, so its presence always means something. -->
    <div id="connstate" hidden></div>

    <main>
      <div id="left">
        <div id="notfound" hidden></div>
        <div id="list"></div>
        <div id="doc" hidden>
          <div id="docbar">
            <button id="back">&larr; back</button>
            <span id="docpath"></span>
            <button id="copylink" class="copylink" title="copy a link to this note">&#9096;</button>
          </div>
          <div id="docbody"></div>
        </div>
      </div>

      <!-- One panel per dynamic source, each hidden until its route answers
           with something to show. A new source needs a block here plus a
           `renderPanel(id, env, build)` call in the script below. -->
      <aside>
        <div class="panel" id="wrap-board" data-source="board" hidden>
          <h2>My PRs<span class="stamp" id="stamp-board"></span></h2>
          <div class="body" id="panel-board"></div>
        </div>
        <div class="panel" id="wrap-peers" data-source="peers" hidden>
          <h2>Peers in flight<span class="stamp" id="stamp-peers"></span></h2>
          <div class="body" id="panel-peers"></div>
        </div>
        <div class="panel" id="wrap-digest" data-source="digest" hidden>
          <h2>Recent activity<span class="stamp" id="stamp-digest"></span></h2>
          <div class="body" id="panel-digest"></div>
        </div>
        <div class="panel" id="wrap-sessions" data-source="sessions" hidden>
          <h2>Sessions<span class="stamp" id="stamp-sessions"></span></h2>
          <div class="body" id="panel-sessions"></div>
        </div>
        <div class="panel" id="wrap-loadout" data-source="loadout" hidden>
          <h2>Loadout<span class="stamp" id="stamp-loadout"></span></h2>
          <div class="body" id="panel-loadout"></div>
        </div>
      </aside>
    </main>

    <script src="/ui/marked.min.js"></script>
    <script src="/ui/mermaid.min.js"></script>
    <script>
      "use strict";

      const el = (id) => document.getElementById(id);
      const listView = el("list");
      const docView = el("doc");

      // --- route rules (mirrored in server.mjs resolveRoute) ---
      //
      // These four functions exist twice on purpose. The server needs them to
      // decide what to serve; this page needs them to read and write
      // `location` without a round-trip. Both copies encode the same rule —
      // the repo-relative path is the slug, trailing `.md` optional — and both
      // are small enough to keep in step. `test/routes.test.mjs` extracts this
      // block by its sentinel comments and asserts the two agree, so a change
      // to one and not the other fails the suite rather than drifting.
      //
      // The only asymmetry is where "does it exist?" is answered: the server
      // asks the filesystem, this page asks the tree it already fetched.
      function parseRoute(pathname) {
        const parts = String(pathname).split("/").filter((s) => s !== "");
        let rest;
        try {
          rest = parts.slice(1).map(decodeURIComponent);
        } catch {
          return { kind: null };
        }
        if (parts[0] === "n" && rest.length) return { kind: "entry", path: rest.join("/") };
        if (parts[0] === "s" && rest.length === 2) {
          return { kind: "session", group: rest[0], id: rest[1] };
        }
        return { kind: null };
      }
      function encodePath(p) {
        return String(p).split("/").map(encodeURIComponent).join("/");
      }
      function entryUrl(p) {
        return "/n/" + encodePath(String(p).replace(/\.md$/i, ""));
      }
      function sessionUrl(group, id) {
        return "/s/" + encodePath(group) + "/" + encodePath(id);
      }
      // --- end route rules ---

      function fmtSize(n) {
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        return (n / (1024 * 1024)).toFixed(1) + " MB";
      }

      // `showStore` is passed down rather than read from a global so a
       // single-store tree renders exactly as it did before this existed.
       // Only non-writable stores are badged: your own notes are the default,
       // and a mounted one is the exception worth marking.
      function entryNode(e, showStore) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.className = "entry";
        b.type = "button";

        const caret = document.createElement("span");
        caret.className = "caret";
        caret.textContent = "▸";
        b.appendChild(caret);

        b.title =
          (e.type === "context" ? "project brief — " : "") + e.path + " — click to open";
        const title = document.createElement("span");
        // The brief is the entry a reader wants first when opening a cold
        // project, and in the tree it looked identical to the notes under it —
        // distinguished only by sorting first, which is invisible. `type` is
        // the one axis that earns emphasis and was the only one getting none.
        if (e.type === "context") title.classList.add("brief");
        title.className = "title";
        title.textContent = e.title || e.name || e.path;
        b.appendChild(title);

        if (showStore && e.store && e.store !== "local") {
          const st = document.createElement("span");
          st.className = "badge";
          st.textContent = e.store;
          st.title = "from the '" + e.store + "' store, which this machine reads but never writes";
          b.appendChild(st);
        }
        if (e.warn) {
          const w = document.createElement("span");
          w.className = "badge warn";
          w.textContent = "⚠ frontmatter";
          w.title = "malformed frontmatter — defaults applied; flag for the next lint pass";
          b.appendChild(w);
        }
        // No raw/file chip: the .meta slot already shows a byte size instead
        // of a date for exactly these entries, and a size IS the
        // "never parsed" signal. The chip restated it in the same visual slot
        // as `done`, which is the collision that prompted this.
        if (e.status && e.status !== "active") {
          const s = document.createElement("span");
          s.className = "badge " + e.status;
          s.textContent = e.status;
          // Deliberately says which of two things this means. On a brief it is
          // project lifecycle and it drives ordering; on a note it is
          // hand-added frontmatter meaning "about work that is over", and the
          // note template does not define it at all.
          s.title =
            e.type === "context"
              ? "project lifecycle — drives this group's rank and default fold"
              : "marked " + e.status + " in this file's frontmatter; notes have no status by default";
          b.appendChild(s);
        }

        const meta = document.createElement("span");
        meta.title = e.listed
          ? "file size — entries under raw/ are listed, never parsed, so there is no date to show"
          : "date, from this file's frontmatter, its filename prefix, or its mtime";
        meta.className = "meta";
        meta.textContent = e.listed ? fmtSize(e.size) : e.date || "";
        b.appendChild(meta);

        b.addEventListener("click", () => openDoc(e));
        li.appendChild(b);
        return li;
      }

      function entriesNode(entries, showStore) {
        const ul = document.createElement("ul");
        ul.className = "entries";
        for (const e of entries) ul.appendChild(entryNode(e, showStore));
        return ul;
      }

      // Fold state lives in localStorage, keyed by section/group. It is UI
      // state, not content: nothing here is written back to the tree, and a
      // browser with storage disabled just falls back to the defaults rather
      // than breaking the render.
      function foldState(key) {
        try {
          const v = window.localStorage.getItem(key);
          return v === null ? null : v === "1";
        } catch {
          return null;
        }
      }

      function setFoldState(key, open) {
        try {
          window.localStorage.setItem(key, open ? "1" : "0");
        } catch {
          /* storage unavailable or full: the default stands */
        }
      }

      /**
       * The tail of a group: entries that cannot need the reader. `done` and
       * `parked` are finished work; `listed` entries are files under a `raw/`
       * directory, never parsed, kept for provenance.
       */
      function isTail(e) {
        return e.listed === true || (e.status && e.status !== "active");
      }

      /**
       * One collapsed line standing in for the tail, summarised by composition
       * so a shut fold still says what it holds. Closed by default and
       * remembered separately from its parent group: expanding a project is a
       * different intent from digging through its finished work.
       */
      function tailFold(sectionName, groupName, tail, showStore) {
        const counts = new Map();
        for (const e of tail) {
          const k = e.listed ? "raw" : e.status;
          counts.set(k, (counts.get(k) || 0) + 1);
        }
        const label = [...counts.entries()]
          .sort((a, b) => (a[0] < b[0] ? -1 : 1))
          .map(([k, n]) => n + " " + k)
          .join(" · ");

        // Finished work above unparsed files, so expanding it reads in the
        // same order the label does.
        const ordered = [...tail].sort((a, b) => Number(a.listed) - Number(b.listed));
        const summary = node("span", "tail-label", label);
        summary.title =
          "entries that cannot need you: finished work, and files under raw/ that are listed but never parsed";
        const fold = foldNode([summary], entriesNode(ordered, showStore));
        const key = "hud.tail." + sectionName + "/" + groupName;
        const saved = foldState(key);
        fold.open = saved === null ? false : saved;
        fold.addEventListener("toggle", () => setFoldState(key, fold.open));
        return fold;
      }

      function renderTree(tree) {
        listView.textContent = "";

        // Provenance is shown only once more than one store contributed, so a
        // single-store HUD looks untouched by this feature.
        const contributing = new Set();
        for (const section of tree.sections) {
          for (const e of section.entries) if (e.store) contributing.add(e.store);
        }
        const showStore = contributing.size > 1;

        // A shadowed note is one the server deliberately did not serve. The
        // API reports it; if the page stayed silent, "reported rather than
        // dropped" would be true only for machines, and a human would see a
        // tree that looks complete.
        const shadowed = Array.isArray(tree.shadowed) ? tree.shadowed : [];
        if (shadowed.length) {
          const d = document.createElement("div");
          d.className = "drift";
          const n = shadowed.length;
          d.textContent =
            n + (n === 1 ? " note is" : " notes are") + " shadowed: " +
            shadowed.map((x) => x.path + " (" + x.store + " → " + x.shadowed_by + ")").join(", ");
          d.title = "the same path exists in more than one store; the writable copy is served";
          listView.appendChild(d);
        }

        for (const section of tree.sections) {
          const h = document.createElement("h2");
          h.className = "section";
          h.textContent = section.name;
          const count = node("span", "count", " (" + section.entries.length + ")");
          count.title = section.entries.length === 1 ? "1 entry" : section.entries.length + " entries";
          h.appendChild(count);
          // The sentence rides the heading as a tooltip and sits under it as
          // text. Hover alone would leave it undiscoverable — a reader has to
          // suspect there is something to hover before they hover.
          if (section.about) h.title = section.about;

          // The section body goes into a fold, same primitive as the groups
          // one level down. Built into a detached div first so every branch
          // below appends to the same place whether or not it folds.
          const sbody = document.createElement("div");
          const sfold = foldNode([h], sbody);
          sfold.classList.add("section-fold");
          // Defaults, in priority order: an empty section has nothing to
          // reveal, and `archive` is the one section that can never need the
          // reader — a peer heading claims peer importance it does not have.
          // Everything else opens.
          const shut = section.entries.length === 0 || section.name === "archive";
          const skey = "hud.section." + section.name;
          const ssaved = foldState(skey);
          sfold.open = ssaved === null ? !shut : ssaved;
          sfold.addEventListener("toggle", () => setFoldState(skey, sfold.open));
          listView.appendChild(sfold);

          if (section.about) sbody.appendChild(node("div", "about", section.about));

          if (!section.entries.length) {
            const e = node("div", "empty", "empty");
            e.title = "nothing filed here yet — the directory exists, it just has no entries";
            sbody.appendChild(e);
            continue;
          }

          if (section.groups && section.groups.length) {
            // Server ordered these active-first; render in that order, each
            // group a native <details> so a finished project reads as one line
            // instead of burying the live ones under its entries.
            for (const g of section.groups) {
              const rows = section.entries.filter((e) => e.group === g.name);
              const gh = node("h3", "group in-summary", g.name);
              gh.title =
                "project — the directory name under " + section.name + "/, ranked by its newest entry";
              if (g.status && g.status !== "active") {
                const gs = node("span", "badge " + g.status, g.status);
                gs.title = "project lifecycle, from status: in this project's CONTEXT.md";
                gh.appendChild(gs);
              }
              const gcount = node("span", "count", " (" + rows.length + ")");
              gcount.title = rows.length === 1 ? "1 entry" : rows.length + " entries, tail included";
              gh.appendChild(gcount);
              // The key the server sorted on. Groups rank by warmth, and an
              // order the reader cannot see explains nothing — without this
              // the sequence looks arbitrary even though it is not.
              if (g.date) {
                const d = node("span", "gdate", g.date);
                d.title = "newest entry in this project";
                gh.appendChild(d);
              }

              // Split the group: what can still need you, and the tail that
              // cannot. Finished notes and never-parsed files are provenance —
              // real, worth keeping, and not worth a row in the primary scan.
              // The largest group here is 19 rows of which 13 are tail, so the
              // reader scans 19 lines to find 6.
              const live = rows.filter((e) => !isTail(e));
              const tail = rows.filter(isTail);
              const body = document.createElement("div");
              if (live.length) body.appendChild(entriesNode(live, showStore));
              if (tail.length) body.appendChild(tailFold(section.name, g.name, tail, showStore));

              const fold = foldNode([gh], body);
              // Default: live work open, everything else shut. A remembered
              // choice wins over the default — the tree is reread constantly
              // (drop a file, refresh), and re-collapsing on every refresh
              // would make the disclosure worse than no disclosure.
              const key = "hud.fold." + section.name + "/" + g.name;
              const saved = foldState(key);
              fold.open = saved === null ? (g.status || "active") === "active" : saved;
              fold.addEventListener("toggle", () => setFoldState(key, fold.open));
              sbody.appendChild(fold);
            }
            const loose = section.entries.filter((e) => !e.group);
            if (loose.length) sbody.appendChild(entriesNode(loose, showStore));
          } else {
            sbody.appendChild(entriesNode(section.entries, showStore));
          }
        }
      }

      // The last tree fetched. A deep link resolves against it: the server
      // hands back the shell for any well-formed /n/ URL, and this is what
      // turns that path back into the entry it names.
      let currentTree = null;

      /** The entry a /n/ path names, applying the same `.md`-optional rule. */
      function findEntry(p) {
        if (!currentTree) return null;
        for (const section of currentTree.sections) {
          for (const e of section.entries) {
            if (e.path === p || e.path === p + ".md") return e;
          }
        }
        return null;
      }

      async function loadTree() {
        try {
          const res = await fetch("/api/tree", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const tree = await res.json();
          currentTree = tree;
          renderTree(tree);
          el("generated").textContent = "generated " + new Date(tree.generated).toLocaleTimeString();
        } catch (err) {
          currentTree = null;
          listView.textContent = "";
          const p = document.createElement("div");
          p.className = "empty";
          p.textContent = "tree unavailable: " + err.message;
          listView.appendChild(p);
        }
      }

      // ------------------------------------------------------ entry metadata
      //
      // /api/md hands back exact file bytes, leading frontmatter included, so
      // a note that opens with a YAML block used to feed that block straight
      // into marked, which mangled it into a single run-together text line.
      // parseEntryMeta splits it out before rendering; the chips it feeds are
      // built by metaChipsNode below.

      /**
       * Detect a LEADING frontmatter block and split it from the body.
       *
       * A block only counts as frontmatter if all three hold: line 1 is
       * exactly "---", a closing "---" line exists within a bounded scan
       * window, and at least one line inside parses as `key: value`. Anything
       * short of that — no block, an unterminated block, or a document that
       * merely opens with a markdown horizontal rule and closes it without a
       * single key inside — is left completely alone: `meta` is null and
       * `body` is the original text, verbatim.
       *
       * Supports the reduced subset server.mjs's parseFrontmatter parses:
       * `key: value`, quoted scalars, `[a, b]` flow arrays, and `key:`
       * followed by `- item` block-array lines. Values are always strings;
       * syntax outside that subset is ignored rather than rejected.
       *
       * `test/ui-meta.test.mjs` extracts this function by name (from
       * "function parseEntryMeta" to the end marker below) and evaluates it
       * in isolation, so it must stay fully self-contained.
       *
       * @param {string} md
       * @returns {{meta: Record<string, string|string[]>|null, body: string}}
       */
      function parseEntryMeta(md) {
        function scalar(v) {
          const q = v[0];
          if ((q === '"' || q === "'") && v.length > 1 && v.endsWith(q)) return v.slice(1, -1);
          return v;
        }
        function flowOrScalar(v) {
          if (v.startsWith("[") && v.endsWith("]")) {
            const inner = v.slice(1, -1).trim();
            if (inner === "") return [];
            return inner
              .split(",")
              .map((s) => s.trim())
              .filter((s) => s !== "")
              .map(scalar);
          }
          return scalar(v);
        }

        const src = typeof md === "string" ? md : String(md == null ? "" : md);
        const lines = src.split(/\r?\n/);
        const unchanged = { meta: null, body: src };
        if (lines[0] !== "---") return unchanged;

        const SCAN_WINDOW = 400; // a closing fence this far down is not a fence
        let end = -1;
        for (let i = 1; i < lines.length && i <= SCAN_WINDOW; i++) {
          if (/^-{3}$/.test(lines[i])) {
            end = i;
            break;
          }
        }
        if (end === -1) return unchanged;

        const data = {};
        let sawKey = false;
        let listKey = null;
        for (const raw of lines.slice(1, end)) {
          const line = raw.replace(/\s+$/, "");
          if (line === "" || /^\s*#/.test(line)) continue;

          const item = /^\s*-\s+(.*)$/.exec(line);
          if (item) {
            if (listKey) data[listKey].push(scalar(item[1].trim()));
            continue;
          }

          const kv = /^([A-Za-z_][A-Za-z0-9_.-]*)[ \t]*:(.*)$/.exec(line);
          if (!kv) continue;
          sawKey = true;
          const key = kv[1];
          const rest = kv[2].trim();
          if (rest === "") {
            listKey = key;
            data[key] = [];
            continue;
          }
          listKey = null;
          data[key] = flowOrScalar(rest);
        }
        if (!sawKey) return unchanged;

        return { meta: data, body: lines.slice(end + 1).join("\n") };
      }
      // parseEntryMeta:end

      /** A frontmatter value read tolerantly as one scalar, mirroring the server's `single()`. */
      function metaScalar(v) {
        const s = Array.isArray(v) ? v[0] : v;
        return typeof s === "string" && s !== "" ? s : undefined;
      }

      /** A frontmatter value read tolerantly as a list, even when it is one bare scalar. */
      function metaList(v) {
        if (v === undefined) return [];
        return Array.isArray(v) ? v : [v];
      }

      /**
       * A configured ticket template pointing at a reserved documentation
       * domain (RFC 2606: example.com/.org/.net/.invalid) is a stand-in, not a
       * real tracker — treated the same as unconfigured.
       */
      function isPlaceholderTicketTemplate(template) {
        return /example\.(?:com|org|net|invalid)/i.test(template);
      }

      /** The URL for one ticket id, or null when no usable template is configured. */
      function ticketUrl(template, id) {
        if (typeof template !== "string" || template === "" || !template.includes("{id}")) {
          return null;
        }
        if (isPlaceholderTicketTemplate(template)) return null;
        return template.split("{id}").join(encodeURIComponent(String(id)));
      }

      // /api/config, not the config's raw bytes through /api/md: the file is
      // TOML now, and the server holds the only parser for it. Fetched once
      // and cached — the template does not change within a page session.
      let ticketTemplateCache;
      async function ticketTemplate() {
        if (ticketTemplateCache !== undefined) return ticketTemplateCache;
        try {
          const res = await fetch("/api/config", { cache: "no-store" });
          if (!res.ok) throw new Error("config unavailable");
          const cfg = await res.json();
          ticketTemplateCache =
            cfg && typeof cfg.ticket_url_template === "string" ? cfg.ticket_url_template : null;
        } catch {
          ticketTemplateCache = null;
        }
        return ticketTemplateCache;
      }

      function chip(text, cls) {
        return node("span", cls ? "badge " + cls : "badge", text);
      }

      /** Chips for one entry's frontmatter, or null when there is nothing to show. */
      function metaChipsNode(meta, template) {
        if (!meta) return null;
        const type = metaScalar(meta.type);
        const status = metaScalar(meta.status);
        const date = metaScalar(meta.date);
        const tags = metaList(meta.tags);
        const tickets = metaList(meta.tickets);
        if (!type && !status && !date && !tags.length && !tickets.length) return null;

        const wrap = node("div", "meta-chips");
        if (type) wrap.appendChild(chip(type));
        // Mirrors entryNode: "active" is the unremarkable default, worth a
        // chip only when it says something other than that.
        if (status && status !== "active") wrap.appendChild(chip(status, status));
        if (date) wrap.appendChild(chip(date));
        for (const tag of tags) wrap.appendChild(chip("#" + tag));
        for (const ticket of tickets) {
          const url = ticketUrl(template, ticket);
          wrap.appendChild(url ? linkOut(url, ticket, "badge") : chip(ticket));
        }
        return wrap;
      }

      /**
       * marked's `code` renderer for ```mermaid fences.
       *
       * The container it returns already holds the plain code block, and that
       * is the point: the code block IS the degraded state. A source mermaid
       * cannot parse, or a page where mermaid failed to load at all, leaves
       * the reader the diagram text rather than an empty frame.
       * `renderMermaidBlocks` swaps in the SVG only on a successful parse.
       *
       * Any other fence returns false, which marked reads as "use your own
       * renderer" — so highlighting, escaping, and the `language-` class on
       * every non-mermaid block stay exactly as they were.
       */
      function mermaidCodeToken(token) {
        // An info string may carry more than the language (```mermaid title=x).
        const lang = String((token && token.lang) || "")
          .trim()
          .split(/\s+/)[0]
          .toLowerCase();
        if (lang !== "mermaid") return false;
        const esc = (s) =>
          String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        return (
          '<div class="mermaid-block" data-mermaid="pending">' +
          '<pre><code class="language-mermaid">' +
          esc((token && token.text) || "") +
          "\n</code></pre></div>\n"
        );
      }
      // mermaidCodeToken:end

      /**
       * Replace each pending mermaid block's source with its rendered SVG.
       *
       * Failure is per-block and silent: one diagram mermaid rejects costs
       * that diagram and nothing else on the entry. `mermaid` is a parameter
       * rather than a read off `window` so this is exercisable against a stub.
       */
      async function renderMermaidBlocks(root, mermaid) {
        if (!root || !mermaid || typeof mermaid.render !== "function") return;
        const blocks = Array.from(root.querySelectorAll('.mermaid-block[data-mermaid="pending"]'));
        for (let i = 0; i < blocks.length; i++) {
          const block = blocks[i];
          const code = block.querySelector("code");
          const src = code && code.textContent;
          if (!src || !src.trim()) continue;
          // Mermaid requires a DOM id unique per render, and an entry can be
          // reopened, so the id carries the clock as well as the position.
          const id = "mermaid-" + Date.now().toString(36) + "-" + i;
          try {
            const out = await mermaid.render(id, src);
            block.innerHTML = out.svg;
            block.setAttribute("data-mermaid", "rendered");
            // Click directives are wired here, not by the SVG markup.
            if (typeof out.bindFunctions === "function") out.bindFunctions(block);
          } catch {
            block.setAttribute("data-mermaid", "error");
          }
        }
      }
      // renderMermaidBlocks:end

      /**
       * Mermaid's theme, expressed in this page's own palette, so a diagram
       * reads as part of the HUD rather than as a pasted-in image. The values
       * come from the CSS custom properties rather than a second copy of the
       * hex codes, so the diagram cannot drift from the page around it.
       */
      function mermaidTheme(cssVar) {
        const v = (name, fallback) => cssVar(name) || fallback;
        const panel = v("--panel", "#241b2f");
        const card = v("--card", "#2a2139");
        const fg = v("--fg", "#f4f0ff");
        const accent = v("--accent", "#f97e72");
        const cyan = v("--cyan", "#36f9f6");
        const magenta = v("--magenta", "#ff7edb");
        const muted = v("--muted", "#848bbd");
        return {
          darkMode: true,
          background: panel,
          primaryColor: card,
          primaryTextColor: fg,
          primaryBorderColor: magenta,
          secondaryColor: panel,
          secondaryTextColor: fg,
          secondaryBorderColor: cyan,
          tertiaryColor: card,
          tertiaryTextColor: fg,
          tertiaryBorderColor: muted,
          lineColor: cyan,
          textColor: fg,
          mainBkg: card,
          nodeBorder: magenta,
          nodeTextColor: fg,
          clusterBkg: panel,
          clusterBorder: muted,
          edgeLabelBackground: panel,
          titleColor: accent,
          fontFamily: v("--mono", "ui-monospace, Menlo, monospace"),
          fontSize: "13px",
        };
      }
      // mermaidTheme:end

      async function openDoc(e, push = true) {
        const rel = e.path;
        clearNotFound();
        // The URL always names what is on screen, so the address bar is a
        // shareable reference and the back button means what it looks like.
        if (push) history.pushState({ kind: "entry", path: rel }, "", entryUrl(rel));
        el("docpath").textContent = rel;
        el("docbody").textContent = "loading…";
        listView.hidden = true;
        docView.hidden = false;
        window.scrollTo(0, 0);
        el("left").scrollTop = 0;
        try {
          const res = await fetch("/api/md?path=" + encodeURIComponent(rel), { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).trim());
          const text = await res.text();
          if (/\.md$/i.test(rel) && !e.listed) {
            // Local, self-authored files: rendered as-is, no sanitizer — but
            // the frontmatter block, if any, is chips, not markdown.
            const { meta, body } = parseEntryMeta(text);
            el("docbody").textContent = "";
            const chips = metaChipsNode(meta, await ticketTemplate());
            if (chips) el("docbody").appendChild(chips);
            const rendered = document.createElement("div");
            rendered.innerHTML = window.marked.parse(body);
            // The body already carries the title as its own heading: nothing
            // to add. No heading at all: the frontmatter title is the one
            // the reader sees, so it becomes the view's title.
            const title = meta && metaScalar(meta.title);
            if (title && !rendered.querySelector("h1")) {
              const h1 = document.createElement("h1");
              h1.textContent = title;
              rendered.insertBefore(h1, rendered.firstChild);
            }
            el("docbody").appendChild(rendered);
            // Diagrams are drawn after the text is on screen: mermaid measures
            // laid-out labels, and no part of reading the entry should wait on
            // it. Unawaited on purpose — a throw in here must not turn the
            // entry into the "could not load" message below.
            renderMermaidBlocks(rendered, window.mermaid).catch(() => {});
          } else {
            // Raw drops and non-markdown are shown verbatim, never interpreted.
            const pre = document.createElement("pre");
            pre.textContent = text;
            el("docbody").textContent = "";
            el("docbody").appendChild(pre);
          }
        } catch (err) {
          el("docbody").textContent = "could not load " + rel + ": " + err.message;
        }
      }

      function closeDoc() {
        docView.hidden = true;
        listView.hidden = false;
      }

      function showNotFound(text) {
        const n = el("notfound");
        n.textContent = text;
        n.hidden = false;
      }

      function clearNotFound() {
        el("notfound").hidden = true;
        el("notfound").textContent = "";
      }

      /** Back to the tree, and say so in the URL. */
      function goHome() {
        if (location.pathname !== "/") history.pushState({ kind: null }, "", "/");
        clearNotFound();
        closeDoc();
      }

      /**
       * Open whatever `location` names. Called on first paint and on every
       * popstate, so forward and back are the same code path as a click.
       *
       * A link that no longer resolves is not an error page: the tree stays
       * on screen and the miss is stated above it, because the usual reason a
       * bookmark stops resolving is that the note was renamed or archived and
       * the next thing the reader wants is to go find it.
       */
      function applyLocation() {
        const route = parseRoute(location.pathname);
        clearNotFound();
        if (route.kind === "entry") {
          const entry = findEntry(route.path);
          if (entry) return openDoc(entry, false);
          closeDoc();
          return showNotFound("no note at " + route.path + " — renamed, archived, or never here.");
        }
        if (route.kind === "session") {
          closeDoc();
          if (!openSession(route.group, route.id, false)) {
            showNotFound(
              "no session " + route.id + " in " + route.group +
                " — the ~/.claude window is a rolling one and may have passed it.",
            );
          }
          return;
        }
        closeDoc();
      }

      /** ⧉ : copy the current URL. Reports success or failure on the button. */
      function copyLink(button) {
        const href = location.href;
        const settle = (mark) => {
          button.textContent = mark;
          setTimeout(() => {
            button.textContent = "⧉";
          }, 1200);
        };
        if (!navigator.clipboard) return settle("⚠");
        navigator.clipboard.writeText(href).then(() => settle("✓"), () => settle("⚠"));
      }

      function copyLinkButton(title) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "copylink";
        b.textContent = "⧉";
        b.title = title;
        b.addEventListener("click", () => copyLink(b));
        return b;
      }

      // ------------------------------------------------------ dynamic panels
      //
      // Three states per panel, decided by what /api/dyn/<source> answers:
      //   200 stale:false  → live data
      //   200 stale:true   → the same rendering, greyed, stamped "as of <t>"
      //   503              → no panel (the source isn't running and has no
      //                      snapshot, or isn't configured at all)
      // Every row links out. There are no action buttons anywhere in here by
      // design: the HUD watches work, it never touches it.

      function node(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      /** Only http(s) becomes a link; anything else renders as inert text. */
      function linkOut(url, text, cls) {
        if (typeof url === "string" && /^https?:\/\//i.test(url)) {
          const a = node("a", cls, text);
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          return a;
        }
        return node("span", cls, text);
      }

      function fmtTime(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return "unknown";
        const sameDay = d.toDateString() === new Date().toDateString();
        return sameDay ? d.toLocaleTimeString() : d.toLocaleString();
      }

      /* True only while renderPanel is building a panel from a snapshot.
         build() is synchronous, so this cannot interleave across panels. */
      let RENDER_STALE = false;

      /* A relative time is a claim about now. Computing one from a snapshot
         turns an old fact into a false one -- a board captured days ago
         renders its stand-up as "in 30m", which is not stale, it is wrong.
         When the source is not live, state the instant instead and let the
         panel's "as of" stamp supply the age. */
      function ago(iso) {
        const then = Date.parse(iso);
        if (isNaN(then)) return "";
        if (RENDER_STALE) return fmtTime(iso);
        const mins = Math.round((Date.now() - then) / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return mins + "m ago";
        if (mins < 60 * 24) return Math.round(mins / 60) + "h ago";
        return Math.round(mins / 1440) + "d ago";
      }
      // ago:end

      function rowsNode(items, build) {
        const ul = node("ul", "rows");
        for (const item of items) ul.appendChild(build(item));
        return ul;
      }

      /**
       * Fill one panel from its envelope, or hide it when there is nothing to
       * show. `build` returns a node, or null for "connected but empty".
       */
      /* What each configured source is actually giving us right now. The
         vocabulary is closed and ordered worst-first, so "not configured"
         (absent from this map entirely) stays distinguishable from
         "configured and answering nothing" -- the same distinction the
         degradation ladder draws on the server. */
      /* `degraded` sits between absent and stale deliberately. An absent
         source gives you nothing, which is obvious. A degraded one answers
         normally while some of its own upstreams are broken, so it renders an
         empty panel that reads "no work" when it means "could not look" --
         less severe than nothing, more dangerous than old. */
      const CONN_RANK = { example: 4, absent: 3, degraded: 2, stale: 1, live: 0 };
      const SOURCE_STATE = new Map();

      /* `note` carries the source's own words about why -- the names of its
         failing upstreams -- so the banner can attribute rather than assert. */
      function noteSource(name, state, why) {
        SOURCE_STATE.set(name, { state, why: why || "" });
        paintConnState();
      }

      /* A payload that reports on its own health. Both spellings are accepted
         because the board changed from camelCase to snake_case: a reader that
         knows only the current one goes quiet against a snapshot written by
         the older shape, which is the failure this whole banner exists to
         prevent. */
      function payloadHealth(d) {
        if (!d || typeof d !== "object") return null;
        const status = d.tickStatus || d.tick_status;
        const degradations = Array.isArray(d.degradations) ? d.degradations : [];
        // Keep the source's own error text. "github" tells you something is
        // wrong; "github: graphql 401" tells you it is an expired token, which
        // is the difference between a notice and a diagnostic.
        const failing = degradations
          .map((x) => {
            if (!x) return "";
            const src = x.source || x.name || "?";
            const err = x.error || x.reason || x.message || "";
            return err ? src + ": " + err : src;
          })
          .filter(Boolean);
        if (status === "example") return { state: "example", why: "" };
        if (failing.length || status === "degraded") {
          return { state: "degraded", why: failing.join(" · ") };
        }
        return null;
      }
      // payloadHealth:end

      function paintConnState() {
        const bar = el("connstate");
        if (!bar) return;
        let worst = "live";
        const named = [];
        const whys = [];
        for (const [name, rec] of SOURCE_STATE) {
          const state = rec && rec.state;
          if (CONN_RANK[state] > CONN_RANK[worst]) {
            worst = state;
            named.length = 0;
            whys.length = 0;
          }
          if (state === worst && state !== "live") {
            named.push(name);
            if (rec.why) whys.push(rec.why);
          }
        }
        bar.className = worst;
        if (worst === "live") {
          bar.hidden = true;
          bar.textContent = "";
          bar.removeAttribute("title");
          return;
        }
        bar.hidden = false;
        const which = named.join(", ");
        // One scannable line: STATE, the source, then the source's own error
        // text verbatim. The explanation of what the state MEANS belongs on
        // the tooltip -- a reader who already knows it should not have to read
        // past it to reach the part that says which token expired.
        const detail = whys.length ? " — " + whys.join(" · ") : "";
        bar.textContent = worst.toUpperCase() + "  " + which + detail;
        bar.title = {
          example:
            "This payload identifies itself as sample data (tickStatus / tick_status: example). Nothing shown is your work.",
          absent:
            "Configured, but nothing answered. No data below is current; 'hud status' shows the endpoint it tried.",
          degraded:
            "The source answered and reported its own failures. The panel below shows only what could be collected, so an empty panel means could-not-look, not nothing-to-do.",
          stale:
            "Served from a snapshot because the source is unreachable. Per-panel 'as of' stamps show each one's age, and relative times are suppressed.",
        }[worst];
      }
      // paintConnState:end

      function renderPanel(id, env, build) {
        const wrap = el("wrap-" + id);
        const body = el("panel-" + id);
        const stamp = el("stamp-" + id);
        body.textContent = "";
        if (!env) {
          wrap.hidden = true;
          stamp.textContent = "";
          return;
        }
        wrap.hidden = false;
        wrap.classList.toggle("stale", !!env.stale);
        stamp.textContent = env.stale ? "as of " + fmtTime(env.cached_at) : "";
        stamp.title = env.stale && env.error ? env.error : "";
        RENDER_STALE = !!env.stale;
        let built;
        try {
          built = build(env);
        } finally {
          RENDER_STALE = false;
        }
        body.appendChild(built || node("div", "empty", "nothing to show"));
      }

      /** work-board's payload, tolerantly: an array or an object holding one. */
      function boardItems(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.items)) return data.items;
        if (data && Array.isArray(data.prs)) return data.prs;
        return [];
      }

      function buildBoard(env) {
        const items = boardItems(env.data);
        if (!items.length) return node("div", "empty", "nothing needs you");
        return rowsNode(items, (item) => {
          const li = document.createElement("li");
          const top = node("div", "row-top");
          if (item.number !== undefined && item.number !== null) {
            top.appendChild(node("span", "num", "#" + item.number));
          }
          top.appendChild(linkOut(item.url, item.title || item.url || "(untitled)", "text"));
          li.appendChild(top);
          const reason = item.reason || item.state;
          if (reason) {
            const sub = node("div", "row-sub");
            sub.appendChild(
              node("span", item.state === "needs_you" ? "needs-you" : null, String(reason)),
            );
            li.appendChild(sub);
          }
          return li;
        });
      }

      function setDial(env) {
        const dial = el("dial");
        if (!env) {
          dial.textContent = "◉ needs-you: —";
          // No count is not a count of zero. Clear the attribute so the dial
          // falls to its base treatment, which is deliberately the quietest of
          // the three: "I don't know" must not look like either answer.
          dial.removeAttribute("data-count");
          dial.classList.remove("stale");
          dial.title = "work-board unavailable";
          return;
        }
        const n = boardItems(env.data).filter((i) => i && i.state === "needs_you").length;
        dial.textContent = "◉ needs-you: " + n;
        // Colour encodes the count, not the freshness. It used to encode
        // freshness, which meant `needs-you: 0` and `needs-you: 7` rendered in
        // the same green — the page's only green, which reads all-clear — while
        // the loudest state on the page was the pre-load "I don't know yet".
        // The one element whose job is "what needs me" answered "is my data
        // fresh" in the channel that wins the pre-attentive race.
        dial.setAttribute("data-count", n > 0 ? "some" : "none");
        // Freshness moves to the idiom the panels already use for it: not
        // colour. Dashed and dimmed, so a stale zero cannot read as a
        // confident zero.
        dial.classList.toggle("stale", Boolean(env.stale));
        dial.title = env.stale ? "from the snapshot of " + fmtTime(env.cached_at) : "live";
      }

      function buildPeers(env) {
        const peers = (env.data && env.data.peers) || [];
        if (!peers.length) return node("div", "empty", "no peers/*.md yet");
        return rowsNode(peers, (peer) => {
          const prs = Array.isArray(peer.prs) ? peer.prs : [];
          const latest = prs
            .map((pr) => pr && pr.updatedAt)
            .filter(Boolean)
            .sort()
            .pop();
          const li = document.createElement("li");
          const top = node("div", "row-top");
          top.appendChild(node("span", "handle", peer.handle));
          top.appendChild(node("span", "text", "· " + prs.length + " open"));
          if (latest) top.appendChild(node("span", "num", ago(latest)));
          li.appendChild(top);
          if (peer.error) {
            const err = node("div", "row-sub", "lookup failed");
            err.title = peer.error;
            li.appendChild(err);
          }
          if (prs.length) {
            const links = node("div", "prlinks");
            for (const pr of prs.slice(0, 6)) {
              const a = linkOut(pr.url, "#" + pr.number);
              a.title = [pr.repository, pr.title].filter(Boolean).join(" · ");
              links.appendChild(a);
            }
            li.appendChild(links);
          }
          return li;
        });
      }

      /** `fs:///a/b/c.md` → `b/c.md`: enough to recognise, short enough to fit. */
      function shortRef(ref) {
        const bare = String(ref).replace(/^[a-z][a-z0-9+.-]*:\/\//i, "");
        const parts = bare.split("/").filter(Boolean);
        return parts.slice(-2).join("/") || bare;
      }

      // An observation's schema belongs to whichever tool produced it, so read
      // it by preference order and fall back to showing the raw object rather
      // than dropping a line the HUD didn't recognise.
      function obsText(obs) {
        if (typeof obs === "string") return obs;
        if (!obs) return "";
        const direct = obs.text || obs.title || obs.summary || obs.message;
        if (direct) return String(direct);
        if (obs.artifact_id) return shortRef(obs.artifact_id);
        return JSON.stringify(obs);
      }

      function obsWhen(obs) {
        if (!obs || typeof obs !== "object") return null;
        const stamp = obs.at || obs.time || obs.updatedAt || obs.date;
        if (stamp) return stamp;
        // Epoch nanos are a number, not a date, until they are scaled.
        const nanos = Number(obs.observed_at_nanos);
        return isFinite(nanos) && nanos > 0 ? new Date(nanos / 1e6).toISOString() : null;
      }

      function buildDigest(env) {
        const lines = Array.isArray(env.data) ? env.data : [];
        if (!lines.length) return node("div", "empty", "no activity in the window");
        return rowsNode(lines.slice(0, 40), (obs) => {
          const li = document.createElement("li");
          const when = obsWhen(obs);
          const top = node("div", "row-top");
          top.appendChild(linkOut(obs && obs.url, obsText(obs), "text"));
          if (when) top.appendChild(node("span", "num", ago(when)));
          li.appendChild(top);
          const kind = obs && (obs.kind || obs.source_id || obs.delivery);
          if (kind) li.appendChild(node("div", "row-sub", String(kind)));
          return li;
        });
      }

      // ----------------------------------------------------- sessions panel
      //
      // Tier 1 (title, times, subagent count) always renders; tier 2 (the
      // commits/PRs/tickets lectio grafted) renders as links out when the
      // daemon answered and as a grey note when it didn't. Clicking a row
      // opens its detail in place — a disclosure, not an action: there is
      // nothing here that resumes, deletes, or otherwise touches a session.

      /** Grafted artifacts as links out, or an honest note about why not. */
      function graftNode(s) {
        if (!s.graft || s.graft === "unavailable") {
          const note = node("div", "row-sub greyed", "graft unavailable");
          note.title = "the lectio daemon did not answer — tier 1 only";
          return note;
        }
        const links = node("div", "prlinks");
        for (const column of ["commits", "prs", "tickets"]) {
          for (const item of s.graft[column] || []) {
            const a = linkOut(item.url, item.label || item.uri, "graft");
            a.title = column + ": " + item.uri;
            links.appendChild(a);
          }
        }
        if (!links.childElementCount) return node("div", "row-sub greyed", "nothing grafted yet");
        return links;
      }

      // `<projectSlug>/<id>` → opener, rebuilt on every sessions render. This
      // is what lets `/s/<group>/<id>` reach a row: the panel owns the DOM, so
      // the route asks it to disclose rather than reaching in itself.
      const sessionRows = new Map();

      /** @returns false when the group/id names no row currently on screen. */
      function openSession(group, id, push = true) {
        const row = sessionRows.get(group + "/" + id);
        if (!row) return false;
        row.open(push);
        return true;
      }

      function sessionNode(s) {
        const li = document.createElement("li");

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sess";
        btn.setAttribute("aria-expanded", "false");
        btn.appendChild(node("span", "text", s.title || s.id));
        if (s.subagentCount) {
          const badge = node("span", "badge", "⑂ " + s.subagentCount);
          badge.title = s.subagentCount + " subagent transcript(s)";
          btn.appendChild(badge);
        }
        if (s.warn) {
          const warn = node("span", "badge warn", "⚠");
          warn.title = "transcript unparseable — filename and mtime only";
          btn.appendChild(warn);
        }
        btn.appendChild(node("span", "num", ago(s.lastAt)));
        li.appendChild(btn);

        const detail = node("div", "sdetail");
        detail.hidden = true;
        detail.appendChild(node("div", "row-sub", s.id));
        // A degraded row has no timestamps at all, and `new Date(null)` is
        // 1970 rather than invalid, so the null case is checked here.
        const when = (iso) => (iso ? fmtTime(iso) : "unknown");
        detail.appendChild(
          node("div", "row-sub", "started " + when(s.startedAt) + " · last " + when(s.lastAt)),
        );
        detail.appendChild(node("div", "row-sub greyed", s.projectSlug));
        detail.appendChild(graftNode(s));
        const share = node("div", "row-sub");
        share.appendChild(copyLinkButton("copy a link to this session"));
        detail.appendChild(share);
        li.appendChild(detail);

        const setOpen = (open, push) => {
          detail.hidden = !open;
          btn.setAttribute("aria-expanded", String(open));
          // Only disclosure moves the URL; collapsing back leaves history
          // alone, so the trail records views rather than every toggle.
          if (open && push) {
            history.pushState(
              { kind: "session", group: s.projectSlug, id: s.id },
              "",
              sessionUrl(s.projectSlug, s.id),
            );
          }
        };
        btn.addEventListener("click", () => setOpen(detail.hidden, true));
        sessionRows.set(s.projectSlug + "/" + s.id, {
          open: (push) => {
            setOpen(true, push);
            btn.scrollIntoView({ block: "nearest" });
          },
        });
        return li;
      }

      function buildSessions(env) {
        const groups = Array.isArray(env.groups) ? env.groups : [];
        if (!groups.length) return node("div", "empty", "no sessions in the window");
        const wrap = node("div", "sessions");
        for (const g of groups) {
          const head = node("div", "sgroup", g.project);
          head.title = g.projectSlug;
          wrap.appendChild(head);
          const ul = node("ul", "rows");
          for (const s of g.sessions) ul.appendChild(sessionNode(s));
          wrap.appendChild(ul);
        }
        if (env.truncated) {
          wrap.appendChild(node("div", "row-sub greyed", "older sessions not shown"));
        }
        wrap.appendChild(
          node(
            "div",
            "footnote",
            "~/.claude is a ~" +
              (env.window_days || 30) +
              "-day rolling window; lectio is the durable archive.",
          ),
        );
        return wrap;
      }

      // ------------------------------------------------------ loadout panel
      //
      // Which skills and agents this machine has, which tree each one really
      // comes from, and where that inventory disagrees with the repositories
      // behind it. Drift leads, because it is the part worth acting on.
      //
      // Display only. There is no button here that installs, relinks, repairs
      // or removes anything — a HUD that could fix its own drift would be a
      // package manager, and this one watches. The single interaction is a
      // native `<details>` disclosure for the long tails.

      /** A disclosure: `summary` parts, then a body revealed on click. */
      function foldNode(summaryParts, body) {
        const fold = node("details", "fold");
        const summary = document.createElement("summary");
        for (const part of summaryParts) summary.appendChild(part);
        fold.appendChild(summary);
        const wrap = node("div", "fold-body");
        wrap.appendChild(body);
        fold.appendChild(wrap);
        return fold;
      }

      /** Stacked paths — a symlink chain, or the names a repo carries. */
      function linesNode(lines) {
        const wrap = document.createElement("div");
        for (const line of lines) wrap.appendChild(node("div", "row-sub chain", line));
        return wrap;
      }

      /**
       * Flags grouped by kind, each folded shut: 40 unlinked skills must read
       * as one line saying so, not as 40 lines burying the broken symlink
       * above them. Severity comes from the server so the colour and the rule
       * cannot drift apart.
       */
      function driftNode(drift) {
        if (!drift.length) return node("div", "row-sub greyed", "no drift");
        const groups = new Map();
        for (const d of drift) {
          if (!groups.has(d.flag)) groups.set(d.flag, []);
          groups.get(d.flag).push(d);
        }
        const wrap = node("div", "drift");
        for (const [flag, items] of groups) {
          const rows = rowsNode(items, (d) => {
            const li = document.createElement("li");
            const top = node("div", "row-top");
            top.appendChild(node("span", "text", d.name || d.slug || "(unnamed)"));
            if (d.repo) top.appendChild(node("span", "num", d.repo));
            li.appendChild(top);
            const where = [d.target, d.path, d.installed, d.repoPath].filter(Boolean);
            if (where.length) li.appendChild(linesNode(where));
            return li;
          });
          wrap.appendChild(
            foldNode(
              [
                chip(flag, items[0].severity === "hot" ? "hot" : "warn"),
                node("span", "num", String(items.length)),
              ],
              rows,
            ),
          );
        }
        return wrap;
      }

      /** One row per installed skill or agent, glyphed by how it got there. */
      function inventoryRows(rows) {
        return rowsNode(rows, (r) => {
          const chain = Array.isArray(r.chain) ? r.chain : [];
          const linked = r.kind === "symlink";
          const li = document.createElement("li");
          const top = node("div", "row-top");
          // ⤳ : the name is here, the bytes are somewhere else.
          const glyph = node("span", linked ? "glyph" : "glyph plain", linked ? "⤳" : "▪");
          glyph.title = r.kind;
          top.appendChild(glyph);
          top.appendChild(node("span", "text", r.name));
          top.appendChild(chip(r.root, r.targetExists ? null : "hot"));
          li.appendChild(top);
          if (chain.length) {
            li.appendChild(
              foldNode(
                [node("span", "num", chain.length + (chain.length === 1 ? " hop" : " hops"))],
                linesNode(chain),
              ),
            );
          }
          return li;
        });
      }

      /** One row per known repository, and the names its `.claude` carries. */
      function repoRows(repos) {
        return rowsNode(repos, (r) => {
          const li = document.createElement("li");
          const top = node("div", "row-top");
          top.appendChild(node("span", "text", r.repo));
          if (r.hasDotClaude) top.appendChild(chip(".claude"));
          li.appendChild(top);
          const carried = [];
          for (const kind of ["skills", "agents", "settings"]) {
            const names = (r.carries && r.carries[kind]) || [];
            if (names.length) carried.push(kind + ": " + names.join(", "));
          }
          if (carried.length) {
            li.appendChild(foldNode([node("span", "num", "carries")], linesNode(carried)));
          }
          return li;
        });
      }

      function buildLoadout(env) {
        const wrap = node("div", "loadout");
        wrap.appendChild(driftNode(Array.isArray(env.drift) ? env.drift : []));
        const inventory = env.inventory || {};
        for (const kind of ["skills", "agents"]) {
          const rows = Array.isArray(inventory[kind]) ? inventory[kind] : [];
          wrap.appendChild(node("div", "sgroup", kind + " · " + rows.length));
          wrap.appendChild(rows.length ? inventoryRows(rows) : node("div", "row-sub greyed", "none"));
        }
        const repos = Array.isArray(env.repos) ? env.repos : [];
        wrap.appendChild(node("div", "sgroup", "repos · " + repos.length));
        wrap.appendChild(repos.length ? repoRows(repos) : node("div", "row-sub greyed", "none"));
        wrap.appendChild(
          node("div", "footnote", "names and paths only — this panel opens no file and changes nothing."),
        );
        return wrap;
      }

      /** @returns the envelope, or null when the source has nothing to show. */
      async function loadDyn(name) {
        try {
          const res = await fetch("/api/dyn/" + name, { cache: "no-store" });
          const body = await res.json().catch(() => null);
          if (!res.ok || !body || body.data === undefined) {
            // 404 is "no such panel" -- an unconfigured source is not a fault
            // and must not raise the banner. Anything else is configured and
            // failing to answer, which is.
            if (res.status === 404) {

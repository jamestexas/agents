<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>work-board · canonical-hours</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--muted:#8b949e;--fg:#e6edf3;
        --opened:#8b949e;--active:#1f6feb;--needs:#f85149;--resolved:#238636;--tick:#f0883e}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;font-weight:600;margin:0}
  .meta{color:var(--muted);font-size:12px}
  .needs-count{color:var(--needs);font-weight:600}
  .controls{display:flex;gap:12px;align-items:center;margin:14px 0 2px;flex-wrap:wrap}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .toggle button{background:var(--panel);color:var(--muted);border:0;padding:7px 15px;font:inherit;font-size:12px;cursor:pointer}
  .toggle button.on{background:var(--active);color:#fff}
  button.refresh{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer}
  .note{color:var(--muted);font-size:11.5px;min-height:18px;margin:6px 0;max-width:920px}
  svg{display:block;margin:0 auto;width:min(94vw,1000px);height:auto}
  .tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;
       padding:10px 12px;font-size:12px;max-width:340px;opacity:0;transition:opacity .12s;z-index:9;box-shadow:0 8px 24px #000b;line-height:1.5}
  .tip .ttl{color:var(--fg)}
  .axes{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
  .axes b{color:#c9d1d9;font-weight:600}
  .legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap;align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .legend .ring{width:12px;height:12px;border:2.5px solid var(--resolved);border-radius:50%;background:transparent}
  .legend svg{display:inline-block;width:auto;height:14px;vertical-align:middle;margin-right:4px}
  .legend .sep{color:#30363d}
  .listwrap{max-width:900px;margin:18px auto 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .listhead{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:7px 12px;font-size:11px;color:var(--muted)}
  .copybtn{background:#21262d;color:var(--fg);border:1px solid #30363d;border-radius:5px;padding:4px 12px;font:inherit;font-size:11px;cursor:pointer}
  .copybtn:hover{border-color:#8b949e}
  .listtext{margin:0;padding:12px;font-size:11.5px;line-height:1.6;color:var(--fg);white-space:pre;overflow:auto;max-height:280px;background:#0b0f14}
  .statelbl{font-size:13px;font-weight:700}.zonesub{font-size:9.5px;fill:#586069}.ringlbl{fill:#586069;font-size:10px}
  text.num,text.act{paint-order:stroke;stroke:#0d1117;stroke-width:3px;stroke-linejoin:round}
  .node rect.rowhit{fill:transparent}
  .node:hover rect.rowhit{fill:#ffffff0d}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>work-board</h1><span class="meta" id="meta">loading…</span></header>
  <div class="controls">
    <div class="toggle">
      <button id="b2" class="on" onclick="setMode('c2')">◷ dial</button>
      <button id="b1" onclick="setMode('c1')">◴ sweep</button>
      <button id="bs" onclick="setMode('stack')">▤ stack</button>
    </div>
    <div class="toggle">
      <button id="fall" class="on" onclick="setFilter('all')">all</button>
      <button id="fmine" onclick="setFilter('author')">mine</button>
      <button id="frev" onclick="setFilter('reviewer')">reviewing</button>
      <button id="fneed" onclick="setFilter('needs')">needs me</button>
    </div>
    <button class="refresh" id="stalebtn" onclick="toggleStale()" style="display:none"></button>
    <button class="refresh" id="copybtn" onclick="copyList()">⧉ copy list</button>
    <button class="refresh" id="reloadbtn" onclick="liveRefresh()">↻ refresh (live)</button>
  </div>
  <div class="note" id="note"></div>
  <svg id="dial" viewBox="0 0 900 760"></svg>
  <div class="axes" id="axes"></div>
  <div class="legend">
    <span><i style="background:var(--opened)"></i>opened</span>
    <span><i style="background:var(--active)"></i>active</span>
    <span><i style="background:var(--needs)"></i>needs_you</span>
    <span><i style="background:var(--resolved)"></i>resolved</span>
    <span class="sep">|</span>
    <span><i class="ring"></i>merge-ready</span><span>┈ draft</span>
    <span class="sep">|</span>
    <span style="color:#484f58">why:</span>
    <span style="color:#238636">merge</span><span style="color:#f0883e">fix ci</span><span style="color:#a371f7">respond</span><span style="color:#58a6ff">review</span><span style="color:#8b949e">ready?</span>
  </div>
  <div class="listwrap" id="listwrap">
    <div class="listhead"><span>text · reflects the current filter (hidden in stack — the rows are the list)</span></div>
    <pre id="listtext" class="listtext"></pre>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
const COLOR={opened:"#8b949e",active:"#1f6feb",needs_you:"#f85149",resolved:"#238636",event:"#d2a8ff"};
const ACTION={merge:"#238636",ci:"#f0883e",respond:"#a371f7",review:"#58a6ff",promote:"#8b949e",attend:"#d2a8ff"};
const ACTLABEL={merge:"merge",ci:"fix ci",respond:"respond",review:"review",promote:"ready?",attend:"attend"};
function actionOf(d){
  if(d.kind==="event") return "attend";
  if(d.waiting_on!=="me") return null;
  if(d.role==="reviewer") return "review";
  if(d.is_draft) return "promote";
  if(/change/i.test(d.reason||"")) return "respond";
  if(d.merge_ready) return "merge";
  if(/fail|ci|check|codegen|e2e/i.test(d.reason||"")) return "ci";
  return "respond";
}

const cx=450,cy=360,R=270,innerR=72,maxAge=48;
const stateAngle={opened:0,active:90,needs_you:180,resolved:270};
const zoneSub={opened:"no reviews yet",active:"in review",needs_you:"your move",resolved:"done"};
const AXES={
  c2:'<span><b>quadrant</b>=state</span><span><b>radius</b>=staleness (rim=oldest)</span><span><b>shape</b> ●yours ◆reviewing</span><span><b>fill</b> solid=needs you · hollow=monitoring</span><span><b>label</b>=next action</span>',
  c1:'<span><b>angle</b>=recency (top=now)</span><span><b>colour</b>=state</span><span><b>fill</b> solid=needs you · hollow=monitoring</span>',
  stack:'<span><b>vertical</b>=time (future ↑ · now · staler ↓)</span><span><b>shape</b> ●yours ◆reviewing ▢event</span><span><b>fill</b> solid=needs you · hollow=monitoring</span><span><b>tag</b>=next action</span>'
};
const svg=d3.select("#dial"),tip=d3.select("#tip");
const scaf=svg.append("g"),nodes=svg.append("g");
let mode="c2",filter="all",all=[],items=[],genAt=Date.now();
const STALE_H=14*24;                       // reviewer asks with no activity in 14d → "possibly stale"
let showNoise=false, botCount=0, staleCount=0, noiseCount=0;
const isStale=d=>d.role==="reviewer"&&ageH(d)>STALE_H;
const isBot=d=>d.role==="reviewer"&&d.bot===true;
const isNoise=d=>isBot(d)||isStale(d);     // reviewer asks that are bot/deps OR gone stale

const polar=(deg,r)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
const ageH=d=>((genAt-Date.parse(d.last_activity))/3600000);          // >0 past, <0 future
const etaH=d=>((Date.parse(d.start||d.last_activity)-genAt)/3600000); // hours until (events)
const arcPath=(a0,a1,r)=>{const[x0,y0]=polar(a0,r),[x1,y1]=polar(a1,r);return`M${cx},${cy} L${x0},${y0} A${r},${r} 0 0,1 ${x1},${y1} Z`;};
const symbol=d3.symbol();
const glyph=d=>symbol.type(d.kind==="event"?d3.symbolSquare:(d.role==="reviewer"?d3.symbolDiamond:d3.symbolCircle))
                     .size(d.state==="needs_you"||d.kind==="event"?300:200)();
const fmtAge=h=>h<1.5?"just now":h<48?"~"+Math.round(h)+"h ago":"~"+Math.round(h/24)+"d ago";
const trunc=(s,n)=>s&&s.length>n?s.slice(0,n-1)+"…":s;

function attach(sel){
  sel.style("cursor","pointer")
    .on("mousemove",(e,d)=>{const a=actionOf(d);tip.style("opacity",1).style("left",(e.clientX+14)+"px").style("top",(e.clientY+14)+"px")
      .html(`<span class="ttl">${d.kind==="event"?"▢ event":"#"+d.number}</span> · <b style="color:${COLOR[d.state]}">${d.state}</b>`
        +(a?` · <b style="color:${ACTION[a]}">→ ${ACTLABEL[a]}</b>`:``)
        +`<br>${d.title}`
        +`<br><span style="color:#8b949e">${d.kind==="event"?"▢ calendar":(d.role==="reviewer"?"◆ reviewing":"● yours")} · ${d.waiting_on==="me"?"waiting on YOU":"monitoring"}${d.is_draft?" · draft":""}</span>`
        +`<br><span style="color:#8b949e">${d.kind==="event"?("in "+fmtAge(-etaH(d)).replace(" ago","")):("last activity "+fmtAge(ageH(d)))}</span>`
        +`<br><span style="color:#8b949e">${d.reason||""}</span>`);})
    .on("mouseleave",()=>tip.style("opacity",0))
    .on("click",(e,d)=>{if(d.url)window.open(d.url,"_blank");});
}

// ---------- DIAL (c1/c2) ----------
function computeGroups(){
  const by={}; items.forEach(d=>{(by[d.state]=by[d.state]||[]).push(d);});
  Object.values(by).forEach(list=>{list.sort((a,b)=>ageH(b)-ageH(a));list.forEach((d,k)=>{d._gi=k;d._gn=list.length;});});
}
function dialXY(d){
  const af=Math.min(Math.max(ageH(d),0),maxAge)/maxAge, gi=d._gi||0, gn=d._gn||1;
  if(mode==="c2"){
    const step=gn>1?Math.min(18,76/(gn-1)):0, off=(gi-(gn-1)/2)*step;
    return polar((stateAngle[d.state]??0)+off, innerR+af*(R-innerR));
  }
  return polar(af*300, innerR+70+(d.state==="needs_you"?54:0)+((gi*26)%88));
}
function renderDial(){
  computeGroups();
  const sel=nodes.selectAll("g.node").data(items,d=>d.artifact_uri);
  sel.exit().remove();
  const g=sel.enter().append("g").attr("class","node");
  g.append("path"); g.append("text").attr("class","num").attr("text-anchor","middle").attr("font-size",11).attr("fill","#8b949e");
  g.append("text").attr("class","act").attr("text-anchor","middle").attr("font-size",10).attr("font-weight",700);
  const m=g.merge(sel); attach(m);
  m.select("path").attr("d",glyph)
    .attr("fill",d=>d.waiting_on==="me"?(COLOR[d.state]||"#30363d"):"none")
    .attr("stroke",d=>d.merge_ready?"#238636":(COLOR[d.state]||"#30363d"))
    .attr("stroke-width",d=>d.merge_ready?3:(d.waiting_on==="me"?1.2:2.2))
    .attr("stroke-dasharray",d=>d.is_draft?"3,2.5":null);
  m.each(function(d){
    const [x,y]=dialXY(d), vx=x-cx, vy=y-cy, r=Math.hypot(vx,vy)||1, ux=vx/r, uy=vy/r,
          nr=(d.state==="needs_you"?12:9), a=actionOf(d), n=d3.select(this);
    n.select("text.num").attr("x",-ux*(nr+11)).attr("y",-uy*(nr+11)+4).text("#"+d.number).attr("opacity",d.waiting_on==="me"?1:0.65);
    n.select("text.act").attr("x",ux*(nr+14)).attr("y",uy*(nr+14)+4).text(a?ACTLABEL[a]:"").attr("fill",a?ACTION[a]:"transparent");
  });
  m.transition().duration(700).ease(d3.easeCubicOut).attr("transform",d=>{const[x,y]=dialXY(d);return`translate(${x},${y})`;});
}

// ---------- STACK (vertical time column) ----------
function renderStack(){
  const events=items.filter(d=>d.kind==="event").sort((a,b)=>etaH(a)-etaH(b));   // soonest first
  const prs=items.filter(d=>d.kind!=="event").sort((a,b)=>ageH(a)-ageH(b));       // freshest first
  const ordered=[...events,...prs];
  const nowIdx=events.length;
  const gx=90, actX=118, titleX=196, ageX=832, top=64;
  const rowH=Math.max(24,Math.min(46,(700-top)/Math.max(ordered.length+1,1)));
  const yOf=i=>top+(i+(i>=nowIdx?1:0))*rowH;  // leave a slot for the now-line

  // now-line: only a meaningful split once there are future events; otherwise a plain recent→stale caption
  scaf.selectAll(".nowline").remove();
  const nl=scaf.append("g").attr("class","nowline");
  if(events.length){
    const ny=top+nowIdx*rowH+rowH*0.5;
    nl.append("line").attr("x1",60).attr("y1",ny).attr("x2",840).attr("y2",ny).attr("stroke","#f0883e").attr("stroke-dasharray","4,4").attr("opacity",.7);
    nl.append("text").attr("x",60).attr("y",ny-6).attr("fill","#f0883e").attr("font-size",11).text("— now  (↑ upcoming · ↓ open work, staler toward bottom)");
  }else{
    nl.append("text").attr("x",60).attr("y",top-14).attr("fill","#586069").attr("font-size",11).text("↑ most recent      ·      stalest ↓");
  }

  const sel=nodes.selectAll("g.node").data(ordered,d=>d.artifact_uri);
  sel.exit().remove();
  const g=sel.enter().append("g").attr("class","node");
  g.append("rect").attr("class","rowhit").attr("rx",6);
  g.append("path");
  g.append("text").attr("class","s-act").attr("font-size",10.5).attr("font-weight",700).attr("dy",4);
  g.append("text").attr("class","s-ttl").attr("font-size",12.5).attr("dy",4);
  g.append("text").attr("class","s-age").attr("text-anchor","end").attr("font-size",11).attr("fill","#586069").attr("dy",4);
  const m=g.merge(sel); attach(m);
  m.select("rect.rowhit").attr("x",56).attr("y",-rowH*0.42).attr("width",788).attr("height",rowH*0.84);
  m.select("path").attr("transform",`translate(${gx},0)`).attr("d",glyph)
    .attr("fill",d=>d.waiting_on==="me"?(COLOR[d.state]||"#30363d"):"none")
    .attr("stroke",d=>d.merge_ready?"#238636":(COLOR[d.state]||"#30363d"))
    .attr("stroke-width",d=>d.merge_ready?3:(d.waiting_on==="me"?1.2:2.2))
    .attr("stroke-dasharray",d=>d.is_draft?"3,2.5":null);
  m.select("text.s-act").attr("x",actX).text(d=>{const a=actionOf(d);return a?ACTLABEL[a]:"";}).attr("fill",d=>{const a=actionOf(d);return a?ACTION[a]:"transparent";});
  m.select("text.s-ttl").attr("x",titleX)
    .attr("fill",d=>d.waiting_on==="me"?"#e6edf3":"#8b949e")
    .text(d=>(d.kind==="event"?"":"#"+d.number+"  ")+trunc(d.title,58));
  m.select("text.s-age").attr("x",ageX).attr("fill",d=>d.waiting_on==="me"?"#8b949e":"#484f58")
    .text(d=>d.kind==="event"?("in "+fmtAge(-etaH(d)).replace(/ ago| just now/,"").replace("just now","<1h")):fmtAge(ageH(d)));
  m.transition().duration(600).ease(d3.easeCubicOut).attr("transform",(d,i)=>`translate(0,${yOf(i)})`);
}

function drawScaffold(){
  scaf.selectAll(":not(.nowline)").remove();
  if(mode==="stack") return;                     // stack draws its own now-line
  if(mode==="c2"){
    scaf.append("path").attr("d",arcPath(135,225,R)).attr("fill","#f8514910");
    [innerR,(innerR+R)/2,R].forEach((r,k)=>scaf.append("circle").attr("cx",cx).attr("cy",cy).attr("r",r).attr("fill","none").attr("stroke",k===2?"#30363d":"#1c2128"));
    [45,135,225,315].forEach(a=>{const[x,y]=polar(a,R);scaf.append("line").attr("x1",cx).attr("y1",cy).attr("x2",x).attr("y2",y).attr("stroke","#1c2128");});
    Object.entries(stateAngle).forEach(([s,a])=>{const[x,y]=polar(a,R+26);
      scaf.append("text").attr("x",x).attr("y",y).attr("text-anchor","middle").attr("class","statelbl").attr("fill",COLOR[s]).text(s);
      scaf.append("text").attr("x",x).attr("y",y+13).attr("text-anchor","middle").attr("class","zonesub").text(zoneSub[s]);});
    [[innerR,"now"],[(innerR+R)/2,"~1d"],[R,"2d+ stale"]].forEach(([r,t])=>{const[x,y]=polar(315,r);
      scaf.append("text").attr("x",x-6).attr("y",y).attr("text-anchor","end").attr("class","ringlbl").text(t);});
    scaf.append("text").attr("x",cx).attr("y",cy+4).attr("text-anchor","middle").attr("class","ringlbl").text("· fresh ·");
  }else{
    [innerR,(innerR+R)/2,R].forEach((r,k)=>scaf.append("circle").attr("cx",cx).attr("cy",cy).attr("r",r).attr("fill","none").attr("stroke",k===2?"#30363d":"#1c2128"));
    ["now","~12h","~1d","~2d+"].forEach((t,k)=>{const[x,y]=polar(k*75,R+22);
      scaf.append("text").attr("x",x).attr("y",y).attr("text-anchor","middle").attr("class","ringlbl").text(t);});
    scaf.append("text").attr("x",cx).attr("y",cy+4).attr("text-anchor","middle").attr("class","ringlbl").text("angle = recency →");
  }
}

// tick hand (dial only)
const hand=svg.append("line").attr("stroke","#f0883e").attr("stroke-width",1.5).attr("opacity",.5);
let ha=8;(function spin(){ha=(ha+0.1)%360;const on=mode!=="stack";hand.attr("opacity",on?.5:0);
  if(on){const[x,y]=polar(ha,R-5);hand.attr("x1",cx).attr("y1",cy).attr("x2",x).attr("y2",y);}requestAnimationFrame(spin);})();

function applyFilter(){
  const base=filter==="all"?all:filter==="needs"?all.filter(d=>d.waiting_on==="me"):all.filter(d=>d.role===filter);
  botCount=base.filter(isBot).length;
  staleCount=base.filter(d=>isStale(d)&&!isBot(d)).length;
  noiseCount=base.filter(isNoise).length;
  items=showNoise?base:base.filter(d=>!isNoise(d));
}
function toggleStale(){showNoise=!showNoise;applyFilter();render();}

function render(){
  drawScaffold(); if(mode==="stack") renderStack(); else renderDial(); renderList();
  d3.select("#axes").html(AXES[mode]);
  const parts=[]; if(botCount)parts.push(botCount+" deps/bot"); if(staleCount)parts.push(staleCount+" stale");
  d3.select("#stalebtn").style("display",noiseCount>0?"inline-block":"none")
    .text(`⌁ ${noiseCount} low-signal (${parts.join(" · ")}) ${showNoise?"(hide)":"(show)"}`);
}

function renderList(){
  const need=items.filter(d=>d.waiting_on==="me"), mon=items.filter(d=>d.waiting_on==="others");
  const rank={attend:-1,merge:0,respond:1,ci:2,review:3,promote:4};
  need.sort((a,b)=>(rank[actionOf(a)]??9)-(rank[actionOf(b)]??9)||ageH(b)-ageH(a));
  const gl=d=>d.kind==="event"?"▢":(d.role==="reviewer"?"◆":"●");
  const tag=s=>("["+s+"]").padEnd(9);
  const id=d=>d.kind==="event"?"       ":("#"+d.number).padEnd(7);
  const need1=d=>`- ${tag(ACTLABEL[actionOf(d)]||"")} ${gl(d)} ${id(d)} ${d.title}${d.url?"  "+d.url:""}`;
  const mon1 =d=>`- ${tag(d.role==="reviewer"?"reviewed":"in review")} ${gl(d)} ${id(d)} ${d.title}${d.url?"  "+d.url:""}`;
  let t="";
  if(need.length) t+=`NEEDS YOU (${need.length})\n`+need.map(need1).join("\n")+"\n";
  if(mon.length)  t+=(need.length?"\n":"")+`MONITORING (${mon.length})\n`+mon.map(mon1).join("\n")+"\n";
  d3.select("#listtext").text(t.trim()||"(nothing in view)");
}
function copyList(){const t=d3.select("#listtext").text();
  navigator.clipboard.writeText(t).then(()=>{const b=d3.select("#copybtn");b.text("copied ✓");setTimeout(()=>b.text("⧉ copy list"),1200);})
  .catch(()=>{const el=document.getElementById("listtext"),r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);});}

function setMode(x){const wasStack=mode==="stack",isStack=x==="stack";mode=x;
  ["c2","c1","stack"].forEach(k=>d3.select("#"+(k==="c2"?"b2":k==="c1"?"b1":"bs")).classed("on",k===x));
  d3.select("#listwrap").style("display",isStack?"none":"block");
  if(wasStack!==isStack) nodes.selectAll("*").remove();   // templates differ across families
  d3.select("#note").text(
    x==="c2"?"Bottom = needs_you (your move). Items drift to the rim as they go stale — a red rim node is an aging obligation. ● yours / ◆ reviewing · solid = on you, hollow = monitoring."
   :x==="c1"?"Placed purely by recency (freshest at top, older swings clockwise); state is colour only."
   :"Vertical = time. Future events sit above the now-line, PRs below sorted freshest→stalest. Solid = needs you, hollow = monitoring. The line drops toward the bottom as things rot.");
  render();}

function setFilter(f){filter=f;[["all","fall"],["author","fmine"],["reviewer","frev"],["needs","fneed"]].forEach(([k,id])=>d3.select("#"+id).classed("on",k===f));applyFilter();render();}

function applyBoard(b){
  all=(b.items||[]).map(d=>({role:d.role||"author",waiting_on:d.waiting_on||(d.state==="active"?"others":"me"),is_draft:d.is_draft??/draft/i.test(d.reason||""),kind:d.kind||"pr",...d}));
  genAt=Date.parse(b.generated_at)||Date.now();
  const need=all.filter(d=>d.waiting_on==="me"), mon=all.filter(d=>d.waiting_on==="others").length, rev=all.filter(d=>d.role==="reviewer").length;
  const byA={}; need.forEach(d=>{const a=actionOf(d);if(a)byA[a]=(byA[a]||0)+1;});
  const actStr=Object.keys(byA).length?" ("+Object.entries(byA).map(([a,n])=>n+" "+ACTLABEL[a]).join(" · ")+")":"";
  d3.select("#meta").html(`${all.length} items · <span class="needs-count">${need.length} need you${actStr}</span> · ${mon} monitoring · ${rev} reviewing `
     +`<span style="color:#484f58">· ${new Date(genAt).toISOString().slice(0,16).replace("T"," ")}</span>`);
  applyFilter(); render();                     // renders in the CURRENT mode/filter — no view reset
}
function loadBoard(){return fetch("data/board.json",{cache:"no-store"})
  .then(r=>r.ok?r.json():Promise.reject()).then(applyBoard)
  .catch(()=>fetch("data/board.example.json",{cache:"no-store"}).then(r=>r.json()).then(applyBoard));}  // fresh clone: example data
function flashBtn(b,msg){b.text(msg);setTimeout(()=>b.text("↻ refresh (live)"),1500);}
function liveRefresh(){
  const b=d3.select("#reloadbtn"); if(b.attr("data-busy"))return; b.attr("data-busy",1).text("refreshing…");
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),45000);   // hard cap: never hang
  fetch("/refresh",{method:"POST",signal:ctl.signal})
    .then(r=>{if(!r.ok)throw new Error("bad");return r.json();})
    .then(x=>{applyBoard(x);flashBtn(b,"↻ updated ✓");})
    .catch(err=>loadBoard()                                    // fallback: re-read file (static server / timeout)
        .then(()=>flashBtn(b,err.name==="AbortError"?"↻ timed out — re-read file":"↻ re-read file"))
        .catch(()=>flashBtn(b,"↻ failed — see console")))
    .finally(()=>{clearTimeout(to);b.attr("data-busy",null);});
}
loadBoard().then(()=>setMode("c2"))
  .catch(()=>d3.select("#meta").text("could not load data/board.json — run scripts/serve.py, open over http (not file://)"));
</script>
</body>
</html>

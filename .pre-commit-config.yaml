repos:
  # >>> rsry-managed (do not edit between these markers; `rsry hooks install` regenerates) >>>
  - repo: local
    hooks:
      - id: rsry-bead-sync
        name: rsry bead export sync (rosary-00f2b5)
        entry: rsry hooks run pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  # <<< rsry-managed <<<
  - repo: local
    hooks:
      - id: agents-skills-lint
        name: Lint agent/skill frontmatter against Anthropic + Gemini specs
        entry: scripts/build.sh lint
        language: script
        files: ^(agents|skills)/.*\.md$
        pass_filenames: false
      - id: agents-skills-readme
        name: Regenerate README tables from frontmatter
        entry: scripts/build.sh readme
        language: script
        files: ^(agents|skills)/.*\.md$
        pass_filenames: false
